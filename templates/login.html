<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><title>Sign in</title></head><body class="auth-body"><main class="auth-card"><div class="auth-logo"><img src="{{url_for('static',filename='images/drdo-logo.jpg')}}" alt="DRDO logo"></div><h1>SIEM SOC Console</h1><p>Sign in to access the protected console.</p>{% for message in get_flashed_messages() %}<p class="error">{{message}}</p>{% endfor %}<form method="post"><input name="username" placeholder="Username" required><input name="password" type="password" placeholder="Password" required><button class="button">Sign in</button></form><p>New user? <a class="cyan" href="/signup">Create an account</a></p></main></body></html>
