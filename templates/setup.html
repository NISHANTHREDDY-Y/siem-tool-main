<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}"><title>Create administrator</title></head><body class="auth-body"><main class="auth-card"><div class="auth-logo"><img src="{{url_for('static',filename='images/drdo-logo.jpg')}}" alt="DRDO logo"></div><h1>Create administrator</h1><p>Create the first protected administrator account for this console.</p>{% for message in get_flashed_messages() %}<p class="error">{{message}}</p>{% endfor %}<form method="post"><input name="full_name" placeholder="Full name" required><input name="username" placeholder="Administrator username" required><input name="email" type="email" placeholder="Email address" required><input name="phone" type="tel" placeholder="Phone number" required><input name="password" id="password" type="password" placeholder="Password (at least 10 characters)" required><meter id="strength" min="0" max="5" value="0"></meter><small id="strengthText">Password strength</small><input name="confirm_password" type="password" placeholder="Confirm password" required><button class="button">Create account</button></form></main><script>const p=document.getElementById('password'),m=document.getElementById('strength'),t=document.getElementById('strengthText');p.addEventListener('input',()=>{let v=p.value,s=(v.length>=10)+( /[A-Z]/.test(v))+( /[a-z]/.test(v))+( /\d/.test(v))+( /[^\w]/.test(v));m.value=s;t.textContent=['Password strength','Weak','Fair','Good','Strong','Excellent'][s]})</script></body></html>
